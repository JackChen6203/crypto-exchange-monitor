services:
  crypto-monitor:
    build: .
    container_name: crypto-exchange-monitor
    restart: unless-stopped
    
    # 環境變量配置
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      - TZ=Asia/Taipei
    
    # 掛載配置文件
    volumes:
      - ./config.properties:/app/config.properties:ro
      - ./logs:/app/logs
    
    # 網絡配置（如果需要）
    networks:
      - monitor-network
    
    # 健康檢查
    healthcheck:
      test: ["CMD", "pgrep", "java"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # 資源限制
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'
    
    # 日誌配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 可選：添加監控服務（如Prometheus）
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: prometheus
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml
  #   networks:
  #     - monitor-network

networks:
  monitor-network:
    driver: bridge

volumes:
  logs:
    driver: local 